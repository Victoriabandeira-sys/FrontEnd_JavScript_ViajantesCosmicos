<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajantes Cósmicos</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <!-- Container -->
    <main class="max-w-7xl mx-auto px-6 py-14">

        <!-- Header -->
        <header class="text-center mb-20">

            <p class="text-cyan-400 uppercase tracking-[0.3rem] text-sm mb-5">
                Arquivo Intergaláctico
            </p>

            <h1 class="text-4xl md:text-6xl font-black mb-5">
                Cyber Travelers
            </h1>

            <p class="text-zinc-400 max-w-2xl mx-auto mb-10 leading-relaxed">
                Exploradores digitais atravessando galáxias desconhecidas, coletando
                sinais cósmicos e registrando distorções espaciais em uma rede neural
                interplanetária.
            </p>

            <!-- Tags Cyber -->
            <section id="tags" class="flex flex-wrap gap-3 justify-center mb-14"></section>
        </header>

        <!-- Grid Cards -->
        <section id="cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-10">
        </section>
    </main>

    <script type="module" src="./js/script.js"></script>

</body>

</html>
